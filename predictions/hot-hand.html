<script>
(function(){
  "use strict";
  var N = JSON.parse(document.getElementById("data").textContent);
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function longDate(ymd){ var p=ymd.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
  $("kicker").textContent = N.kicker; $("title").textContent = N.title;
  $("asof").innerHTML = '<span>Results as of</span><b>'+esc(longDate(N.as_of))+'</b>';
  $("reg").innerHTML = 'Pre-registered '+esc(longDate(N.registered.date))+' (commit '+esc(N.registered.commit)+', <code>'+esc(N.registered.path)+'</code>) before any analysis ran. Results generated '+esc(N.generated)+'.';
  $("question").textContent = N.question;
  if(N.headline){ $("headline").textContent = N.headline; } else { $("headline").style.display="none"; }
  // Dot plots, one per group of findings.
  var groups = {};
  (N.findings||[]).forEach(function(f){ (groups[f.group]=groups[f.group]||[]).push(f); });
  var html = "";
  Object.keys(groups).forEach(function(g){
    var rows = groups[g], W=820, L=330, R=20, rowH=26, H=rows.length*rowH+40;
    var lo=Math.min(0, Math.min.apply(null, rows.map(function(r){return r.lo;}))), hi=Math.max(0, Math.max.apply(null, rows.map(function(r){return r.hi;})));
    var pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
    function X(v){ return L+(W-L-R)*(v-lo)/(hi-lo); }
    var s='<h3 style="font-size:14px;margin:18px 0 4px;color:var(--ink2)">'+esc(rows[0].unit)+'</h3><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
    s+='<line class="zero" x1="'+X(0)+'" x2="'+X(0)+'" y1="8" y2="'+(H-28)+'"/>';
    rows.forEach(function(r,i){ var y=20+i*rowH, sig=(r.lo>0&&r.hi>0)||(r.lo<0&&r.hi<0);
      s+='<text x="'+(L-10)+'" y="'+(y+4)+'" text-anchor="end">'+esc(r.label)+'</text><line class="ci'+(sig?" sig":"")+'" x1="'+X(r.lo)+'" x2="'+X(r.hi)+'" y1="'+y+'" y2="'+y+'"/><circle class="pt'+(sig?" sig":"")+'" cx="'+X(r.estimate)+'" cy="'+y+'" r="4"/>'; });
    [lo+pad, 0, hi-pad].forEach(function(v){ s+='<text x="'+X(v)+'" y="'+(H-8)+'" text-anchor="middle">'+(Math.abs(v)<1e-9?"0":v.toFixed(1))+'</text>'; });
    html += s+'</svg>';
  });
  $("charts").innerHTML = html;
  $("tables").innerHTML = (N.tables||[]).map(function(t){ if(!t.rows.length) return ""; return '<h2>'+esc(t.title)+'</h2><div class="scroll"><table><thead><tr>'+t.columns.map(function(c){return '<th>'+esc(c[1])+'</th>';}).join("")+'</tr></thead><tbody>'
    + t.rows.map(function(r){ return '<tr>'+t.columns.map(function(c,i){ var v=r[c[0]]; return '<td class="'+(i&&/^[+\-\d]/.test(String(v))?"n":"")+'">'+esc(v)+'</td>'; }).join("")+'</tr>'; }).join("")+'</tbody></table></div>'; }).join("");
  $("method").innerHTML = (N.method||[]).map(function(m){ return '<li>'+esc(m)+'</li>'; }).join("");
  if(N.deviations&&N.deviations.length){ $("deviations").innerHTML='<h2>Deviations from the pre-registration</h2><ul>'+N.deviations.map(function(d){return '<li>'+esc(d)+'</li>';}).join("")+'</ul>'; }
  else { $("deviations").innerHTML='<h2>Deviations from the pre-registration</h2><p>None.</p>'; }
  $("foot").innerHTML = 'Data: Cricsheet ball-by-ball (CC BY 4.0). Code: <code>'+esc(N.data.code)+'</code>. Results file: <code>'+esc(N.data.results)+'</code>.'
    + (N.data.downloads ? ' Downloads: '+N.data.downloads.map(function(d){ return '<a href="'+esc(d.href)+'">'+esc(d.label)+'</a>'; }).join(', ')+'.' : '');
})();

<script type="application/json" id="data">{"title":"Test innings, session by session: above or below expectation?","slug":"test-sessions.html","kicker":"Research note \u00b7 cricket","registered":{"date":"2026-10-10","commit":"4cdc35d","path":"docs/research/TEST_SESSIONS_PREREG.md"},"generated":"2026-10-09 14:49 UTC","as_of":"2026-10-09","question":"What should a session-length block of a Test innings produce, given the innings, the wickets down, the runs on the board, the overs bowled, the pitch's age, the lead and the two sides? That expectation is the par a block is judged against. And does a block above par predict the next one, within the innings or in the side's next innings? Cricsheet records no session markers, so the unit is a 30-over block in order; the page never calls them sessions.","headline":"A par for runs works; a par for wickets does not, and blocks carry. Given the state at its start, a 30-over block's runs are predicted about a run per block better than the innings-and-wickets cell average (held-out error 20.0 against 21.0 runs), with calibration that is honest if a little compressed; the registered model for wickets is worse than the simple cell average (1.74 against 1.65 wickets) and badly over-predicts at the top, so by the rule set in advance the cell average is the par for wickets. What a block scores against par carries: a block 10 runs above par is followed, within the same innings, by one about 2.8 runs above par (coefficient 0.28 per over, interval 0.20 to 0.35), and the same holds for wickets; the side's first block of its next innings in the match is still about 1.5 runs above par per 10 (0.15, interval 0.04 to 0.26). Part of this is composition, since a block above par usually means the same two batters are still there, but the controls for wickets and overs do not remove it. Tests carry far more from one block to the next than limited-overs innings carry from one ball to the next. The page lists every Test since 2025 block by block against par.","findings":[{"label":"Runs: model minus innings \u00d7 wickets cell mean","estimate":-0.9585651464023246,"lo":-1.5820527159399127,"hi":-0.3511857217210148,"unit":"Expectation: held-out MAE change per block (negative = model closer)","group":"mae"},{"label":"Runs: model minus all-blocks mean","estimate":-0.9640742358809659,"lo":-1.6151426569708496,"hi":-0.35237646184388904,"unit":"Expectation: held-out MAE change per block (negative = model closer)","group":"mae"},{"label":"Runs: next block, same innings","estimate":0.2821747297036803,"lo":0.20074915462738172,"hi":0.3544081847921624,"unit":"Carry: coefficient of the next block's residual rate on this block's (per over, with state controls)","group":"carry"},{"label":"Runs: side's first block of its next innings","estimate":0.14732119208639458,"lo":0.03667194497758296,"hi":0.25510309300645057,"unit":"Carry: coefficient of the next block's residual rate on this block's (per over, with state controls)","group":"carry"},{"label":"Wickets: model minus innings \u00d7 wickets cell mean","estimate":0.09044395315566525,"lo":0.031354287978303544,"hi":0.15861265960489968,"unit":"Expectation: held-out MAE change per block (negative = model closer)","group":"mae"},{"label":"Wickets: model minus all-blocks mean","estimate":0.03715703769767474,"lo":-0.021672235354030078,"hi":0.10813791072295882,"unit":"Expectation: held-out MAE change per block (negative = model closer)","group":"mae"},{"label":"Wickets: next block, same innings","estimate":0.2791135146769111,"lo":0.14127514718709897,"hi":0.4139473103087249,"unit":"Carry: coefficient of the next block's residual rate on this block's (per over, with state controls)","group":"carry"},{"label":"Wickets: side's first block of its next innings","estimate":0.05586120936250062,"lo":-0.03249467093585823,"hi":0.13997070314541665,"unit":"Carry: coefficient of the next block's residual rate on this block's (per over, with state controls)","group":"carry"}],"tables":[{"title":"Exp <script>
(function(){
  "use strict";
  var N = JSON.parse(document.getElementById("data").textContent);
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function longDate(ymd){ var p=ymd.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
  $("kicker").textContent = N.kicker; $("title").textContent = N.title;
  $("asof").innerHTML = '<span>Results as of</span><b>'+esc(longDate(N.as_of))+'</b>';
  $("reg").innerHTML = 'Pre-registered '+esc(longDate(N.registered.date))+' (commit '+esc(N.registered.commit)+', <code>'+esc(N.registered.path)+'</code>) before any analysis ran. Results generated '+esc(N.generated)+'.';
  $("question").textContent = N.question;
  if(N.headline){ $("headline").textContent = N.headline; } else { $("headline").style.display="none"; }
  // Dot plots, one per group of findings.
  var groups = {};
  (N.findings||[]).forEach(function(f){ (groups[f.group]=groups[f.group]||[]).push(f); });
  var html = "";
  Object.keys(groups).forEach(function(g){
    var rows = groups[g], W=820, L=330, R=20, rowH=26, H=rows.length*rowH+40;
    var lo=Math.min(0, Math.min.apply(null, rows.map(function(r){return r.lo;}))), hi=Math.max(0, Math.max.apply(null, rows.map(function(r){return r.hi;})));
    var pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
    function X(v){ return L+(W-L-R)*(v-lo)/(hi-lo); }
    var s='<h3 style="font-size:14px;margin:18px 0 4px;color:var(--ink2)">'+esc(rows[0].unit)+'</h3><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
    s+='<line class="zero" x1="'+X(0)+'" x2="'+X(0)+'" y1="8" y2="'+(H-28)+'"/>';
    rows.forEach(function(r,i){ var y=20+i*rowH, sig=(r.lo>0&&r.hi>0)||(r.lo<0&&r.hi<0);
      s+='<text x="'+(L-10)+'" y="'+(y+4)+'" text-anchor="end">'+esc(r.label)+'</text><line class="ci'+(sig?" sig":"")+'" x1="'+X(r.lo)+'" x2="'+X(r.hi)+'" y1="'+y+'" y2="'+y+'"/><circle class="pt'+(sig?" sig":"")+'" cx="'+X(r.estimate)+'" cy="'+y+'" r="4"/>'; });
    [lo+pad, 0, hi-pad].forEach(function(v){ s+='<text x="'+X(v)+'" y="'+(H-8)+'" text-anchor="middle">'+(Math.abs(v)<1e-9?"0":v.toFixed(1))+'</text>'; });
    html += s+'</svg>';
  });
  $("charts").innerHTML = html;
  $("tables").innerHTML = (N.tables||[]).map(function(t){ if(!t.rows.length) return ""; return '<h2>'+esc(t.title)+'</h2><div class="scroll"><table><thead><tr>'+t.columns.map(function(c){return '<th>'+esc(c[1])+'</th>';}).join("")+'</tr></thead><tbody>'
    + t.rows.map(function(r){ return '<tr>'+t.columns.map(function(c,i){ var v=r[c[0]]; return '<td class="'+(i&&/^[+\-\d]/.test(String(v))?"n":"")+'">'+esc(v)+'</td>'; }).join("")+'</tr>'; }).join("")+'</tbody></table></div>'; }).join("");
  $("method").innerHTML = (N.method||[]).map(function(m){ return '<li>'+esc(m)+'</li>'; }).join("");
  if(N.deviations&&N.deviations.length){ $("deviations").innerHTML='<h2>Deviations from the pre-registration</h2><ul>'+N.deviations.map(function(d){return '<li>'+esc(d)+'</li>';}).join("")+'</ul>'; }
  else { $("deviations").innerHTML='<h2>Deviations from the pre-registration</h2><p>None.</p>'; }
  $("foot").innerHTML = 'Data: Cricsheet ball-by-ball (CC BY 4.0). Code: <code>'+esc(N.data.code)+'</code>. Results file: <code>'+esc(N.data.results)+'</code>.'
    + (N.data.downloads ? ' Downloads: '+N.data.downloads.map(function(d){ return '<a href="'+esc(d.href)+'">'+esc(d.label)+'</a>'; }).join(', ')+'.' : '');
})();
